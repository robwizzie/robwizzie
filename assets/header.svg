<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Hey, I'm Rob Wiscount: full-stack and iOS developer and co-founder of Mile A Day">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#15141b"/><stop offset="1" stop-color="#2c1217"/>
  </linearGradient>
  <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#ff6a3d" stop-opacity="0.26"/><stop offset="1" stop-color="#ff6a3d" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="trail" x1="0" x2="1">
    <stop offset="0" stop-color="#ff7a45" stop-opacity="0"/><stop offset="1" stop-color="#ff7a45" stop-opacity="0.9"/>
  </linearGradient>
  <clipPath id="card"><rect width="1200" height="360" rx="18"/></clipPath>
  
  <linearGradient id="fl-outer" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffef4a"/><stop offset="0.5" stop-color="#ff9500"/><stop offset="1" stop-color="#ff3a1a"/>
  </linearGradient>
  <linearGradient id="fl-inner" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffe95a"/><stop offset="1" stop-color="#ff9a26"/>
  </linearGradient>
  <clipPath id="fl-mouth"><path d="M438 905 Q600 990 760 905 C 745 1075, 455 1075, 438 905 Z"/></clipPath>
</defs>
<g clip-path="url(#card)">
  <rect width="1200" height="360" fill="url(#bg)"/>
  <circle cx="1020" cy="130" r="165" fill="url(#glow)"/>
  <g font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif">
    <text x="64" y="90" font-size="50" font-weight="700" fill="#f5f2ee" letter-spacing="-0.5">Hey, I'm Rob</text>
    <text x="66" y="130" font-size="21" fill="#c9c1b9">Full-stack and iOS developer · Co-founder of Mile A Day</text>
  </g>
  <text x="66" y="168" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="17" fill="#8f8780" opacity="1">I build apps for my friends, my pool team and anyone who'll run a mile.<animate attributeName="opacity" dur="12.0s" repeatCount="indefinite" keyTimes="0;0.3042;0.3333;0.9708;1" values="1;1;0;0;1"/></text>
<text x="66" y="168" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="17" fill="#8f8780" opacity="0">By day: the platform behind a test-prep company. By night: side projects.<animate attributeName="opacity" dur="12.0s" repeatCount="indefinite" keyTimes="0;0.3333;0.3625;0.6375;0.6667;1" values="0;0;1;1;0;0"/></text>
<text x="66" y="168" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="17" fill="#8f8780" opacity="0">Currently turning my living room TV into a custom home screen.<animate attributeName="opacity" dur="12.0s" repeatCount="indefinite" keyTimes="0;0.6667;0.6958;0.9708;1.0000;1" values="0;0;1;1;0;0"/></text>
  <g transform="translate(64 192)"><rect width="135" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/><circle cx="18" cy="17" r="4" fill="#7aa2ff"/><text x="74.5" y="22" text-anchor="middle" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="15" fill="#e7e1db">South Jersey</text></g><g transform="translate(211 192)"><rect width="234" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/><circle cx="18" cy="17" r="4" fill="#5ccf8a"/><text x="124.0" y="22" text-anchor="middle" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="15" fill="#e7e1db">Shipping on the App Store</text></g>
  <g transform="translate(936 36) scale(0.14)">
    <g><animateTransform attributeName="transform" type="translate" values="0 0;0 -50;0 0" dur="2.4s" repeatCount="indefinite"/>
    <g>
  
  <path d="M600 22 C 700 120, 805 190, 810 305 C 813 350, 800 390, 785 418 C 840 570, 1012 680, 1012 870 C 1012 1080, 860 1175, 600 1175 C 340 1175, 185 1080, 185 860 C 185 790, 220 740, 285 672 C 265 590, 270 520, 300 500 C 320 470, 350 475, 382 503 C 375 300, 440 150, 600 22 Z" fill="url(#fl-outer)"/>
  <path d="M612 420 C 660 500, 760 560, 665 672 C 668 710, 690 740, 715 765 L 808 900 C 808 1030, 710 1090, 600 1090 C 490 1090, 392 1030, 392 900 L 482 745 C 515 640, 515 520, 612 420 Z" fill="url(#fl-inner)"/>
  <ellipse cx="426" cy="808" rx="72" ry="93" fill="#33120a"><animate attributeName="ry" values="93;93;8;93;93" keyTimes="0;0.9;0.93;0.96;1" dur="4s" repeatCount="indefinite"/></ellipse>
  <ellipse cx="774" cy="808" rx="72" ry="93" fill="#33120a"><animate attributeName="ry" values="93;93;8;93;93" keyTimes="0;0.9;0.93;0.96;1" dur="4s" repeatCount="indefinite"/></ellipse>
  <circle cx="404" cy="772" r="21" fill="#fff"><animate attributeName="opacity" values="1;1;0;1;1" keyTimes="0;0.9;0.93;0.96;1" dur="4s" repeatCount="indefinite"/></circle>
  <circle cx="752" cy="772" r="21" fill="#fff"><animate attributeName="opacity" values="1;1;0;1;1" keyTimes="0;0.9;0.93;0.96;1" dur="4s" repeatCount="indefinite"/></circle>
  <path d="M438 905 Q600 990 760 905 C 745 1075, 455 1075, 438 905 Z" fill="#3d0a0a"/>
  <rect x="533" y="992" width="134" height="64" rx="28" fill="#ff6b5a" clip-path="url(#fl-mouth)"/>
  
</g></g>
  </g>

  <!-- the mile: Flamey runs it at a steady pace, keeps going through the finish while he fades,
       then jogs back in from the left edge at the same speed, so he never stops or jumps -->
  <rect x="64" y="283" width="1072" height="2" rx="1" fill="#ffffff" fill-opacity="0.12"/>
  <rect x="63.2" y="279" width="1.5" height="10" fill="#ffffff" fill-opacity="0.25"/><rect x="331.2" y="279" width="1.5" height="10" fill="#ffffff" fill-opacity="0.25"/><rect x="599.2" y="279" width="1.5" height="10" fill="#ffffff" fill-opacity="0.25"/><rect x="867.2" y="279" width="1.5" height="10" fill="#ffffff" fill-opacity="0.25"/><rect x="1135.2" y="279" width="1.5" height="10" fill="#ffffff" fill-opacity="0.25"/>
  <text x="1136" y="272" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#ffffff" fill-opacity="0.35">1 MI</text>
  <rect x="64" y="283" height="2" rx="1" fill="url(#trail)" width="0">
    <animate attributeName="width" values="0;1072;1072;0;0" keyTimes="0;0.9;0.93;0.9301;1" dur="14s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;1;0;1;1" keyTimes="0;0.9;0.93;0.9301;1" dur="14s" repeatCount="indefinite"/>
  </rect>
  <g>
    <animateTransform attributeName="transform" type="translate" values="42 0;1114 0;1150 0;-38 0;42 0" keyTimes="0;0.9;0.93;0.9301;1" dur="14s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;1;0;0;1;1" keyTimes="0;0.9;0.93;0.9301;0.98;1" dur="14s" repeatCount="indefinite"/>
    <g transform="translate(0 236) scale(0.037)">
      <g><animateTransform attributeName="transform" type="translate" values="0 0;0 -80;0 0" dur="0.225s" repeatCount="indefinite"/>
      <g transform="rotate(7 600 700)">
  <g><rect x="425" y="1090" width="90" height="190" rx="45" fill="#ff4a1c"/><ellipse cx="490" cy="1275" rx="75" ry="34" fill="#e8380f"/><animateTransform attributeName="transform" type="rotate" dur="0.45s" repeatCount="indefinite" values="30 470 1110;-30 470 1110;30 470 1110"/></g><g><rect x="685" y="1090" width="90" height="190" rx="45" fill="#ff4a1c"/><ellipse cx="750" cy="1275" rx="75" ry="34" fill="#e8380f"/><animateTransform attributeName="transform" type="rotate" dur="0.45s" repeatCount="indefinite" values="-30 730 1110;30 730 1110;-30 730 1110"/></g>
  <path d="M600 22 C 700 120, 805 190, 810 305 C 813 350, 800 390, 785 418 C 840 570, 1012 680, 1012 870 C 1012 1080, 860 1175, 600 1175 C 340 1175, 185 1080, 185 860 C 185 790, 220 740, 285 672 C 265 590, 270 520, 300 500 C 320 470, 350 475, 382 503 C 375 300, 440 150, 600 22 Z" fill="url(#fl-outer)"/>
  <path d="M612 420 C 660 500, 760 560, 665 672 C 668 710, 690 740, 715 765 L 808 900 C 808 1030, 710 1090, 600 1090 C 490 1090, 392 1030, 392 900 L 482 745 C 515 640, 515 520, 612 420 Z" fill="url(#fl-inner)"/>
  <ellipse cx="426" cy="808" rx="72" ry="93" fill="#33120a"><animate attributeName="ry" values="93;93;8;93;93" keyTimes="0;0.9;0.93;0.96;1" dur="4s" repeatCount="indefinite"/></ellipse>
  <ellipse cx="774" cy="808" rx="72" ry="93" fill="#33120a"><animate attributeName="ry" values="93;93;8;93;93" keyTimes="0;0.9;0.93;0.96;1" dur="4s" repeatCount="indefinite"/></ellipse>
  <circle cx="404" cy="772" r="21" fill="#fff"><animate attributeName="opacity" values="1;1;0;1;1" keyTimes="0;0.9;0.93;0.96;1" dur="4s" repeatCount="indefinite"/></circle>
  <circle cx="752" cy="772" r="21" fill="#fff"><animate attributeName="opacity" values="1;1;0;1;1" keyTimes="0;0.9;0.93;0.96;1" dur="4s" repeatCount="indefinite"/></circle>
  <path d="M438 905 Q600 990 760 905 C 745 1075, 455 1075, 438 905 Z" fill="#3d0a0a"/>
  <rect x="533" y="992" width="134" height="64" rx="28" fill="#ff6b5a" clip-path="url(#fl-mouth)"/>
  <g><rect x="171" y="820" width="68" height="200" rx="34" fill="#ff7a12"/><circle cx="205" cy="1020" r="44" fill="#ff8f1f"/><animateTransform attributeName="transform" type="rotate" dur="0.45s" repeatCount="indefinite" values="-35 205 840;35 205 840;-35 205 840"/></g><g><rect x="961" y="820" width="68" height="200" rx="34" fill="#ff7a12"/><circle cx="995" cy="1020" r="44" fill="#ff8f1f"/><animateTransform attributeName="transform" type="rotate" dur="0.45s" repeatCount="indefinite" values="35 995 840;-35 995 840;35 995 840"/></g>
</g></g>
    </g>
  </g>
  <text x="64" y="324" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="15" fill="#a39b94"><tspan fill="#ff7a45" font-weight="600">● LIVE</tspan>  228 people on Mile A Day  ·  77,569 miles logged  ·  6.9 miles today</text><text x="1136" y="324" text-anchor="end" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="15" fill="#a39b94">Top Dawgs 4–1 · #1 in division</text>
</g>
