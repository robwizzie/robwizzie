<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240" role="img" aria-label="Rob Wiscount, full-stack and iOS developer">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#14141a"/><stop offset="1" stop-color="#2a1216"/>
  </linearGradient>
  <linearGradient id="fade" x1="0" x2="1">
    <stop offset="0" stop-color="#e2554a" stop-opacity="0"/><stop offset="0.5" stop-color="#e2554a" stop-opacity="0.6"/><stop offset="1" stop-color="#e2554a" stop-opacity="0"/>
  </linearGradient>
  <clipPath id="card"><rect width="1200" height="240" rx="16"/></clipPath>
</defs>
<g clip-path="url(#card)">
  <rect width="1200" height="240" fill="url(#bg)"/>
  <g font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif">
    <text x="64" y="104" font-size="52" font-weight="700" fill="#f5f2ee" letter-spacing="-0.5">Rob Wiscount</text>
    <text x="66" y="146" font-size="22" fill="#b9b2ab">Full-stack and iOS developer · Co-founder of Mile A Day</text>
  </g>
  <rect x="0" y="206" width="1200" height="1.5" fill="url(#fade)"/>
  <g>
    <animateTransform attributeName="transform" type="translate" values="-80 0;1220 0" dur="14s" repeatCount="indefinite"/>
    <image href="data:image/png;base64," x="0" y="162" width="36" height="44">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -3;0 0" dur="0.4s" repeatCount="indefinite"/>
    </image>
  </g>
</g>
</svg>