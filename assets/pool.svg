<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="90" viewBox="0 0 1200 90" role="img" aria-label="Cue ball sinks the 8-ball">
<defs>
  <linearGradient id="felt" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0f5132"/><stop offset="1" stop-color="#0a3a24"/></linearGradient>
  <radialGradient id="cue" cx="0.35" cy="0.3" r="0.7"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#cfcfcf"/></radialGradient>
  <radialGradient id="eight" cx="0.35" cy="0.3" r="0.7"><stop offset="0" stop-color="#555"/><stop offset="1" stop-color="#050505"/></radialGradient>
  <clipPath id="c"><rect x="0" y="0" width="1200" height="90" rx="18"/></clipPath>
</defs>
<g clip-path="url(#c)">
  <rect width="1200" height="90" fill="#5a3a22"/>
  <rect x="10" y="10" width="1180" height="70" rx="12" fill="url(#felt)"/>
  <g fill="#e9d8a6" opacity="0.8"><circle cx="150" cy="5" r="2"/><circle cx="150" cy="85" r="2"/><circle cx="300" cy="5" r="2"/><circle cx="300" cy="85" r="2"/><circle cx="450" cy="5" r="2"/><circle cx="450" cy="85" r="2"/><circle cx="600" cy="5" r="2"/><circle cx="600" cy="85" r="2"/><circle cx="750" cy="5" r="2"/><circle cx="750" cy="85" r="2"/><circle cx="900" cy="5" r="2"/><circle cx="900" cy="85" r="2"/><circle cx="1050" cy="5" r="2"/><circle cx="1050" cy="85" r="2"/></g>
  <circle cx="1170" cy="45" r="17" fill="#050505"/>
  <!-- cue stick strike -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="80 0;40 0;122 0;-400 0;-400 0" keyTimes="0;0.12;0.16;0.3;1" dur="6s" repeatCount="indefinite"/>
    <rect x="-260" y="41" width="250" height="8" rx="4" fill="#c8915a"/>
    <rect x="-22" y="41" width="12" height="8" rx="3" fill="#e6f0ff"/>
  </g>
  <!-- cue ball -->
  <circle cx="0" cy="45" r="14" fill="url(#cue)">
    <animate attributeName="cx" values="130;130;780;790;790;130" keyTimes="0;0.16;0.5;0.56;0.94;1" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.9;0.94;0.99;1" dur="6s" repeatCount="indefinite"/>
  </circle>
  <!-- 8 ball -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 0;358 0;358 0;0 0" keyTimes="0;0.5;0.78;0.97;1" dur="6s" repeatCount="indefinite"/>
    <circle cx="812" cy="45" r="14" fill="url(#eight)">
      <animate attributeName="r" values="14;14;0;0;14" keyTimes="0;0.76;0.82;0.97;1" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="812" cy="45" r="6" fill="#fff">
      <animate attributeName="r" values="6;6;0;0;6" keyTimes="0;0.76;0.82;0.97;1" dur="6s" repeatCount="indefinite"/></circle>
    <text x="812" y="48.5" text-anchor="middle" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="9" font-weight="800" fill="#000">8
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.76;0.78;0.97;1" dur="6s" repeatCount="indefinite"/></text>
  </g>
  <text x="600.0" y="51" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#e9d8a6" opacity="0">
    8-ball, corner pocket · Top Dawgs 🎱
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.8;0.84;0.95;1" dur="6s" repeatCount="indefinite"/></text>
</g>
</svg>