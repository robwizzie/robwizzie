name: Contribution snake

on:
  schedule:
    - cron: "17 5 * * *" # daily
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-light&color_snake=#c0392b&color_dots=#ebedf0,#ffd6a5,#ffad60,#ff7b39,#c0392b
            dist/snake-dark.svg?palette=github-dark&color_snake=#ffb347&color_dots=#161b22,#4a1018,#8a1c22,#d9441f,#ffb347

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
